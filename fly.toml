app = 'geraset-celosmg1'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  GERASET_REMOTE = '1'
  GERASET_RELAY_DB = '/data/relay.sqlite3'

[[mounts]]
  source = 'geraset_data'
  destination = '/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 8
    hard_limit = 12
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
